name: Danmarkskort Service Monitor

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  check-services:
    runs-on: ubuntu-latest

    steps:
      - name: Tjek alle services
        run: |
          FAILED=""

          # $4 = ekstra HTTP-koder der også regnes som "servicen lever",
          # fx 401 fra et endpoint der kræver login. Uden det ville et
          # korrekt afvist kald blive rapporteret som nedbrud.
          check_url() {
            local name="$1"
            local url="$2"
            local expect="$3"
            local extra_ok="$4"

            http_code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
              --max-time 15 --retry 2 "$url" 2>/dev/null)

            local ok_codes="200 400 404 $extra_ok"

            if [ "$http_code" = "000" ]; then
              FAILED="${FAILED}\n❌ ${name}: Ingen forbindelse (timeout eller ukendt domæne)"
              echo "FEJL: $name → ingen forbindelse"
            elif ! echo " $ok_codes " | grep -q " $http_code "; then
              FAILED="${FAILED}\n❌ ${name}: HTTP ${http_code}"
              echo "FEJL: $name → HTTP $http_code"
            elif [ -n "$expect" ] && ! grep -q "$expect" /tmp/resp.txt; then
              FAILED="${FAILED}\n❌ ${name}: Uventet svar"
              echo "FEJL: $name → forventede '$expect' i svaret"
            else
              echo "✅ $name → OK"
            fi
          }

          # CVF WMS — tjek at serveren svarer
          check_url "CVF WMS (statsveje)" \
            "https://geocloud.vd.dk/CVF/wms?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetCapabilities" \
            "" ""

          # VD Proxy — km-pæle
          check_url "VD Proxy (km-pæle)" \
            "https://vd-proxy.danmarkskortet.workers.dev/reference?geometry=POINT(683573%206095809)&roadNumber=700&roadPart=0" \
            "" ""

          # ORS gennem vd-proxy — tjekker domæne, API-nøgle og kvote i ét.
          # Kræver "Hamburg" i svaret: en opbrugt kvote eller ugyldig nøgle
          # giver 403/429 og fanges dermed, i stedet for at gå ubemærket hen.
          check_url "ORS via VD Proxy (rute + udland)" \
            "https://vd-proxy.danmarkskortet.workers.dev/ors/geocode/search?text=Hamburg&size=1" \
            "Hamburg" ""

          # Danmarkskort-SP Proxy — /auth/me svarer 401 uden cookie.
          # 401 betyder at workeren kører og afviser korrekt.
          check_url "Danmarkskort-SP Proxy (enheder + leverandører)" \
            "https://danmarkskort-sp.danmarkskortet.workers.dev/auth/me" \
            "" "401"

          # Dataforsyningen Ortofoto WMS
          check_url "Dataforsyningen Ortofoto WMS" \
            "https://api.dataforsyningen.dk/orto_foraar_DAF?service=WMS&request=GetCapabilities&token=${{ secrets.DATAFORSYNINGEN_TOKEN }}" \
            "WMS_Capabilities" ""

          # ── Adresser og opslag (afløser for DAWA, som lukkede 1/10-2026) ──
          # Adressevælgeren — adressesøgning i kortet og leverandør-appen
          check_url "Adressevælgeren (adressesøgning)" \
            "https://adressevaelger.dk/adresser/soeg?tekst=Vejle&token=adressevaelger123&maksimum=1" \
            "" ""

          # Datafordeleren via vd-proxy — reverse geokodning (klik på kortet)
          check_url "Datafordeleren via VD Proxy (klik på kortet)" \
            "https://vd-proxy.danmarkskortet.workers.dev/daf/reverse?x=9.5357&y=55.7113" \
            "kommunekode" ""

          # ── Trafik og vejr ──
          # Vejdirektoratets trafikdata via vd-proxy (advarsler, vejarbejder, vind)
          check_url "VD trafikdata via VD Proxy" \
            "https://vd-proxy.danmarkskortet.workers.dev/trafik/25832/wind-speeds.point.json" \
            "FeatureCollection" ""

          # DMI — temperatur, vind og lyn
          check_url "DMI åbne data (metObs)" \
            "https://opendataapi.dmi.dk/v2/metObs/collections/observation/items?parameterId=temp_dry&period=latest-hour&limit=1" \
            "FeatureCollection" ""

          # RainViewer — nedbørsradar
          check_url "RainViewer (nedbørsradar)" \
            "https://api.rainviewer.com/public/weather-maps.json" \
            "radar" ""

          # ── Ladestandere (Monta via vd-proxy) ──
          # Live-status for ét ladepunkt — tjekker Monta-login og adgang i ét
          check_url "Ladestandere live-status (Monta via VD Proxy)" \
            "https://vd-proxy.danmarkskortet.workers.dev/lade/status?evse=DK*NTC*E5232164" \
            "status" ""

          # OpenChargemap API
          check_url "OpenChargemap API" \
            "https://api.openchargemap.io/v3/poi/?output=json&countrycode=DK&maxresults=1&key=${{ secrets.OPENCHARGEMAP_KEY }}" \
            "" ""

          # Selve kortsiden
          check_url "Danmarkskort GitHub Pages" \
            "https://anderskabel.github.io/Danmarkskort/" \
            "Danmarkskort" ""

          # Datafiler siden er afhængig af
          check_url "danske-farvande.geojson" \
            "https://anderskabel.github.io/Danmarkskort/danske-farvande.geojson" \
            "FeatureCollection" ""

          check_url "disponeringsomraader.json" \
            "https://anderskabel.github.io/Danmarkskort/disponeringsomraader.json" \
            "omraader" ""

          # Kommune- og postnummergrænser (opdateres af "Opdater kommune- og postnummergrænser")
          check_url "kommuner.geojson" \
            "https://anderskabel.github.io/Danmarkskort/kommuner.geojson" \
            "FeatureCollection" ""

          check_url "postnumre.geojson" \
            "https://anderskabel.github.io/Danmarkskort/postnumre.geojson" \
            "FeatureCollection" ""

          # Ladesteder (opdateres af "Opdater ladestandere")
          check_url "ladestandere.json" \
            "https://anderskabel.github.io/Danmarkskort/ladestandere.json" \
            "steder" ""

          if [ -n "$FAILED" ]; then
            echo ""
            echo "================================================"
            echo "FEJL OPDAGET — GitHub sender notifikation til dig"
            echo "================================================"
            echo -e "$FAILED"
            exit 1
          else
            echo ""
            echo "✅ Alle services svarer korrekt"
          fi
